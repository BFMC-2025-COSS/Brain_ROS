frequency: 30                 # EKF 내부 반복 주기 (Hz)
sensor_timeout: 0.2           # 센서가 이 시간 동안 안 들어오면 무시
two_d_mode: true              # 2D 로봇 모드 (z, roll, pitch는 무시)

# ============ 오도메트리 (initial_odo.py) ============ #
odom0: /odom                       # initial_odo.py가 퍼블리시하는 토픽
odom0_config: [true, true, false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
# (x, y, yaw)만 사용, 나머지 false

odom0_differential: false          # 만약 /odom이 누적 pose형태면 false, 증분형이면 true
odom0_queue_size: 2
odom0_pose_covariance:  [0.01, 0, 0, 0, 0, 0,
                         0, 0.01, 0, 0, 0, 0,
                         0, 0, 99999, 0, 0, 0,
                         0, 0, 0, 99999, 0, 0,
                         0, 0, 0, 0, 99999, 0,
                         0, 0, 0, 0, 0, 0.01]
# x,y의 표준편차 약 0.1m 라고 가정(이건 예시)
# yaw(마지막 행) 표준편차 ~0.1 rad (약 5.7도)
# z/roll/pitch는 99999로 큰 값 => 사용 안 함

odom0_twist_covariance: [99999, 0, 0, 0, 0, 0,
                         0, 99999, 0, 0, 0, 0,
                         0, 0, 99999, 0, 0, 0,
                         0, 0, 0, 99999, 0, 0,
                         0, 0, 0, 0, 99999, 0,
                         0, 0, 0, 0, 0, 99999]
# 오도메트리에 twist 정보가 제대로 없다면 전부 큰 값으로.

# ============ ICP 결과 (coss_localization.py) ============ #
pose0: /icp_odom                # coss_localization.py가 발행하는 토픽 (Odometry or Pose)
pose0_config: [true, true, false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
# (x, y, yaw)만 사용

pose0_queue_size: 2
pose0_pose_covariance: [0.001, 0, 0, 0, 0, 0,
                        0, 0.001, 0, 0, 0, 0,
                        0, 0, 99999, 0, 0, 0,
                        0, 0, 0, 99999, 0, 0,
                        0, 0, 0, 0, 99999, 0,
                        0, 0, 0, 0, 0, 0.001]
# ICP 매칭이 비교적 정확하다고 가정, x,y std 약 0.0316m, yaw std 약 0.0316 rad(1.8도).
# 실제 로봇 환경 따라 조정.

# ============ IMU (선택) ============ #
# IMU 토픽이 있으면 추가:
imu0: /imu/data
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
# 여기서는 yaw만 사용한다고 가정 (회전속도/가속도는 사용안함)
imu0_queue_size: 2
imu0_pose_covariance: [99999, 0, 0, 0, 0, 0,
                       0, 99999, 0, 0, 0, 0,
                       0, 0, 99999, 0, 0, 0,
                       0, 0, 0, 99999, 0, 0,
                       0, 0, 0, 0, 99999, 0,
                       0, 0, 0, 0, 0, 0.01]
# yaw 오차 0.1 rad
# 나머지는 99999

# ============ 프레임 설정 ============ #
world_frame: odom        # 최종 world 좌표계
odom_frame: odom         # 중간 odom 프레임
base_link_frame: base_link

publish_tf: true         # 필터 결과를 TF로도 브로드캐스팅

# ============ 기타 ============ #
print_diagnostics: true  # 토픽 갱신 상태나 센서 타임스탬프 경고 출력
